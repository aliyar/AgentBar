name: AgentBar
options:
  bundleIdPrefix: com.greatpixels
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.45.0"
  defaultSourceDirectoryType: syncedFolder

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: RCQFGHVGQJ
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
  configs:
    release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  AgentBarKit:
    path: Packages/AgentBarKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.6"

targets:
  AgentBar:
    type: application
    platform: macOS
    sources:
      - path: AgentBar
      - path: Supporting
        type: group
        buildPhase: none
        optional: true
    dependencies:
      - package: AgentBarKit
      - package: Sparkle
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: AgentBar
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 GreatPixels. All rights reserved."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        ITSAppUsesNonExemptEncryption: false
        # Sparkle 2: the feed and the zips are served from the site, never from GitHub, so the
        # repository can stay private. SUPublicEDKey is filled in once the EdDSA key pair exists
        # (`generate_keys --account agentbar`, see docs/RELEASING.md); the updater does not start
        # while it is empty.
        SUFeedURL: "https://agentbar.greatpixels.com/appcast.xml"
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: Supporting/AgentBar.entitlements
      properties:
        # Not sandboxed: the app exists to read ~/.claude and ~/.codex.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greatpixels.AgentBar
        PRODUCT_NAME: AgentBar
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - AgentBarTests
        - package: AgentBarKit/AgentBarKitTests
      gatherCoverageData: true

  AgentBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AgentBarTests
    dependencies:
      - target: AgentBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greatpixels.AgentBarTests
        GENERATE_INFOPLIST_FILE: YES
